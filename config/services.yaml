parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\Controller\AuthController:
        arguments:
            $connexionUtilisateurLimiter: '@limiter.connexion_utilisateur'

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'